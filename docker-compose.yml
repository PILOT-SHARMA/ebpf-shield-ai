# ──────────────────────────────────────────────────────────────
# docker-compose.yml — eBPF-Shield AI
# Kernel-Level Cloud-Native Runtime Threat & Container Escape Engine
#
# Usage:
#   docker compose up --build          # Start all services
#   docker compose up --build -d       # Start in background
#   docker compose down                # Stop all services
#   docker compose logs -f backend     # View backend logs
#   docker compose logs -f collector   # View collector logs
# ──────────────────────────────────────────────────────────────

services:
  # ─── PostgreSQL Database ───
  postgres:
    image: postgres:16-alpine
    container_name: ebpf-shield-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ebpf_shield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ebpf_shield_dev_2024}
      POSTGRES_DB: ${POSTGRES_DB:-ebpf_shield}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ebpf_shield}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - ebpf-net

  # ─── FastAPI Backend + ML Engine ───
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ebpf-shield-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ebpf_shield}:${POSTGRES_PASSWORD:-ebpf_shield_dev_2024}@postgres:5432/${POSTGRES_DB:-ebpf_shield}
      COLLECTOR_MODE: ${COLLECTOR_MODE:-replay}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - ebpf-net

  # ─── Nginx Frontend ───
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ebpf-shield-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - ebpf-net

  # ─── Telemetry Collector (Replay Mode) ───
  collector:
    build:
      context: .
      dockerfile: Dockerfile.collector
    container_name: ebpf-shield-collector
    environment:
      COLLECTOR_MODE: ${COLLECTOR_MODE:-replay}
      COLLECTOR_INTERVAL: ${COLLECTOR_INTERVAL:-5}
      BACKEND_URL: http://backend:8000
      PYTHONUNBUFFERED: "1"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ebpf-net

volumes:
  pgdata:
    driver: local

networks:
  ebpf-net:
    driver: bridge
